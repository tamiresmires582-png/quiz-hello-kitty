<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Hello Kitty: Front-End</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="telaInicial">
        <h1>🎀 Quiz Hello Kitty 🎀</h1>
        <p>Teste seus conhecimentos de Front-End!</p>
        <button id="btnComecar">Começar Quiz</button>
    </div>
    
    <div id="telaQuiz" style="display: none;">
        <h1>🎀 Quiz Hello Kitty 🎀</h1>
        <p id="pergunta">Carregando...</p>
        <div id="opcoes"></div>
        <p id="resultado"></p>
        <button id="btnProxima" style="display: none;">Próxima Pergunta →</button>
        <button id="btnJogarNovamente" style="display: none;">Jogar de Novo</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
